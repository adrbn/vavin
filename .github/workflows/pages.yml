# Publishes specimen/ to GitHub Pages. Enable once in the repository:
# Settings > Pages > Source: GitHub Actions.
name: Specimen

on:
  push:
    branches: [main]
    paths: ["specimen/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: specimen
      - id: deployment
        uses: actions/deploy-pages@v4
