# Test harness: copy dist/Vavin/app/Vavin-{Regular,Bold}-Latin.ttf into
# Sources/ (make fonts specimen first), then run `xcodegen` here.
name: VavinDemo
options:
  bundleIdPrefix: app.vavin
  deploymentTarget:
    iOS: "17.0"
targets:
  VavinDemo:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vavin
        UILaunchScreen: {}
        UIAppFonts:
          - Vavin-Regular-Latin.ttf
          - Vavin-Bold-Latin.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vavin.demo
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
